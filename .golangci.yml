# golangci-lint v2 configuration. CI runs it; locally `make lint` runs it when
# installed.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # unchecked errors: covered by errcheck
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, bodyclose]
      # The healthcheck binary probes an operator-supplied URL by design.
      - path: cmd/healthcheck/
        text: G107

formatters:
  enable:
    - gofmt
